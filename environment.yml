name: csstochastic
channels:
  - conda-forge
  - cadwr-dms
  - defaults
dependencies:
  - python=3.11
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - openpyxl
  - xlrd
  - netcdf4
  - python-dotenv
  - pyhecdss
  - pip
  - pip:
    - pydsstools<3   # pin to 2.x; 3.0 made HecDss.Open(...) strict (rejects catalog_flag=True) and removed getPathnameList. Requires VS Build Tools with C++ workload on Windows.
